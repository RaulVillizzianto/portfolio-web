name: Build y deploy a GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La versión de pnpm sale de `packageManager` en package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequeo de tipos y contenido
        run: pnpm check

      - name: Build
        run: pnpm build

      # Genera public/cv.pdf con Playwright y vuelve a compilar para que la página /cv
      # muestre el enlace de descarga. Si algo falla, el sitio se publica igual sin PDF.
      - name: Generar CV en PDF
        continue-on-error: true
        run: |
          pnpm add -D playwright@1.64.1
          pnpm exec playwright install --with-deps chromium
          pnpm cv
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
